[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telescope"
version = "0.2.0"
description = "TeleScope - LLM-powered multilingual international news monitoring and geopolitical brief generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = []
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
telescope = "telescope.cli:main"

[tool.setuptools.packages.find]
include = ["telescope*"]
